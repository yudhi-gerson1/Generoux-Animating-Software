<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Generoux</title><style>
:root{color-scheme:dark;--bg:#111317;--pn:#1c2026;--p2:#2a3038;--tx:#e9edf2;--ac:#9be34a;--bd:#3a424d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px system-ui,sans-serif;overflow:hidden;user-select:none}
#app{height:100%;display:flex;flex-direction:column}#stage{flex:1;position:relative;min-height:0}#cv{width:100%;height:100%;display:block;touch-action:none}
button,input,select{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:8px}button{min-width:38px;height:38px;cursor:pointer}button.on{background:var(--ac);color:#111;border-color:var(--ac)}
#tools{position:absolute;left:8px;top:8px;display:grid;grid-template-columns:repeat(2,46px);gap:4px;padding:5px;background:color-mix(in srgb,var(--pn) 93%,transparent);border-radius:12px;z-index:5;touch-action:none}
#tools.hz{grid-template-columns:none;grid-template-rows:repeat(2,50px);grid-auto-flow:column}#tools button{min-width:0;width:46px;height:50px;padding:0}button{display:inline-flex;flex-direction:column;align-items:center;justify-content:center}button small{font-size:9px;line-height:1;margin-top:3px;opacity:.85;pointer-events:none}button .i{font-size:17px;line-height:1;pointer-events:none}#mid button{flex:1;max-width:72px;height:48px;padding:0 2px}#tc button{height:44px;padding:0 6px}.sw{width:26px;height:26px;min-width:0;padding:0;border-radius:50%}.th{width:64px;height:36px;object-fit:cover;border-radius:6px;background:var(--p2)}.shp{width:72px;height:62px}.lb{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 14px;background:var(--p2);border:1px solid var(--bd);border-radius:8px;overflow:hidden;flex:1}.lb .fo{position:absolute!important;inset:0;opacity:0;width:100%!important;height:100%!important;padding:0!important;min-width:0!important;cursor:pointer}#wh{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px}#wv{position:relative;height:44px;margin-top:4px;overflow:hidden;background:var(--p2);border-radius:8px}#wv .bk{position:absolute;top:2px;height:40px;border-radius:6px;background:#2a9d8f55;border:1px solid var(--ac);box-sizing:border-box;touch-action:none;cursor:grab}#wv canvas{width:100%;height:100%;display:block;pointer-events:none}body.h #wv,body.h #wh,body.h #pm{display:none}#pm{position:absolute;right:8px;bottom:8px;z-index:4;width:auto;padding:0 12px;height:38px}#pm.on{background:#ff7a45;border-color:#ff7a45;color:#111}
#mid{background:var(--pn);display:flex;gap:4px;padding:4px;justify-content:space-around}#tl{background:var(--pn);padding:4px;border-top:1px solid var(--p2)}
#tc{display:flex;gap:4px;align-items:center;margin-bottom:4px}#strip{display:flex;gap:4px;overflow-x:auto}
.fr{flex:none;position:relative;border:2px solid transparent;border-radius:6px;background:var(--p2)}.fr.a{border-color:var(--ac)}.fr canvas{display:block;width:80px;height:45px}
.fr i{position:absolute;left:2px;top:1px;font-size:10px;font-style:normal;background:#14161bb3;padding:0 3px;border-radius:3px}.fr b{position:absolute;bottom:0;left:0;right:0;font-size:9px;background:var(--ac);color:#111;text-align:center;overflow:hidden;white-space:nowrap}
#pop{position:absolute;left:8px;right:8px;bottom:8px;max-height:62%;overflow:auto;background:color-mix(in srgb,var(--pn) 96%,transparent);border:1px solid var(--bd);border-radius:12px;padding:10px;z-index:6}
.hid{display:none!important}details{margin:4px 0;width:100%}summary{cursor:pointer;font-weight:600}.r{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}.r input:not([type=range]):not([type=checkbox]):not([type=radio]):not([type=color]),.r select{flex:1;min-width:60px;height:32px;padding:0 6px}.r input[type=range]{flex:1}.r input[type=color]{width:40px;height:32px;padding:0}
#eye{position:absolute;right:8px;top:8px;z-index:5;display:none}body.h #tools,body.h #mid,body.h .x{display:none}body.h #eye{display:block}
#ex{position:absolute;inset:0;perspective:900px;display:flex;align-items:center;justify-content:center;background:#16181dcc;z-index:9}#stk{transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-25deg);position:relative;width:280px;height:160px}#stk canvas{position:absolute;inset:0;border:1px solid var(--ac);background:#fff1}
#toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:var(--ac);color:#111;padding:6px 12px;border-radius:20px;z-index:8;font-weight:600}
#gh{height:18px;display:flex;align-items:center;justify-content:center;touch-action:none}#gh i{width:42px;height:4px;border-radius:2px;background:#4a4f5c}
#tcw{overflow:hidden;margin-bottom:4px;touch-action:none}#tcs{display:flex;width:100%;transform:translateX(0);transition:transform .3s cubic-bezier(.2,.8,.2,1)}#tcw.p2 #tcs{transform:translateX(-100%)}#tcs>div{flex:none;width:100%;display:flex;gap:4px;align-items:center;margin:0}
#tf button{flex:1;min-width:0;padding:0 2px;height:44px}#tf small{white-space:normal;text-align:center;font-size:8px;line-height:1.05}
#sw{position:relative}#sm{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#ff4d6d;pointer-events:none;z-index:2}
#tl.ex{display:flex;flex-direction:column;overflow:hidden;padding-top:calc(4px + env(safe-area-inset-top,0px));padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}#tl.ex #sw{flex:1;min-height:0;display:flex;flex-direction:column}#tl.ex #strip{display:grid;grid-template-columns:repeat(4,1fr);align-content:start;flex:1;min-height:0;overflow-x:hidden;overflow-y:auto}#tph{flex:none}#tl.ex .fr canvas{width:100%;height:auto}#tl.ex #sm,#tl.ex #wv,#tl.ex #wh{display:none!important}
.fr.s{border-color:#4aa3ff}.fr.s::after{content:'✓';position:absolute;right:2px;top:1px;background:#4aa3ff;color:#111;border-radius:50%;width:14px;height:14px;font-size:10px;line-height:14px;text-align:center;font-weight:700}
#av{position:absolute;right:8px;top:8px;z-index:6;width:38px;height:38px;border-radius:50%;border:2px solid #fff4;padding:0;overflow:hidden;background:none}#eye{top:54px!important}
.avt{border-radius:50%;background:linear-gradient(135deg,#2fd66b,#f4e03a);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 auto}.avt img{width:100%;height:100%;object-fit:cover}
#auth{--bg:#111317;--pn:#1c2026;--p2:#2a3038;--tx:#e9edf2;--ac:#9be34a;--bd:#3a424d;background:#12151a;color:#e9edf2}#prof{background:var(--bg);color:var(--tx)}#auth,#prof{position:fixed;inset:0;z-index:100;overflow:auto;padding:max(16px,env(safe-area-inset-top)) 16px 24px}
#auth .card{max-width:380px;margin:6vh auto 0;text-align:center}.lg{width:84px;height:84px;margin:0 auto 12px;border-radius:22%;background:linear-gradient(135deg,#2fd66b,#f4e03a);color:#fff;font:800 56px/84px sans-serif}
#auth input{width:100%;box-sizing:border-box;margin:5px 0;padding:12px;border-radius:10px;border:1px solid #3a404c;background:#1c2026;color:#fff;font-size:15px}
#auth .tabs{display:flex;gap:6px;margin:16px 0 8px}#auth .tabs button{flex:1;height:40px}.er{color:#ff6b81;font-size:13px;min-height:20px}
.pc{display:block;width:100%;text-align:left;background:#1c2026;border-radius:12px;padding:0;margin:10px 0;border:0;overflow:hidden;color:#fff}.pc img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.pc b{display:block;padding:8px 10px}
#mdl{position:fixed;inset:0;z-index:300;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px}.mc{background:var(--pn);color:var(--tx);border-radius:16px;padding:18px;max-width:340px;width:100%;text-align:center}.mc h3{margin:8px 0}.mc p{margin:0 0 14px;opacity:.85}
.dz{border:1px solid #e5484d;border-radius:12px;padding:10px;margin-top:16px}.dz h4{color:#ff6b6b;margin:0 0 8px}.rd{background:#e5484d!important;color:#fff!important;border-color:#e5484d!important}
.pc2{display:flex;gap:10px;background:var(--pn);border-radius:12px;padding:8px;margin:8px 0}.th2{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--p2)}.sx input{flex:1;min-width:0;padding:8px}.sx{margin:6px 0}
</style></head><body><div id=auth></div><div id=prof class=hid></div><div id=app><div id=stage><canvas id=cv></canvas><div id=tools></div><button id=av onclick=profUI()></button><button id=eye>👁</button><div id=pop class=hid></div><div id=ex class=hid></div><div id=toast class=hid></div><button id=pm class=hid>◇ Perspectiva</button></div>
<div id=mid></div><div id=tl><div id=gh><i></i></div><div id=tcw><div id=tcs><div id=tc><button id=pl><span class=i>▶</span><small>Play</small></button><button class=x onclick=addF()><span class=i>＋</span><small>Quadro</small></button><button class=x onclick=delF()><span class=i>🗑</span><small>Apagar</small></button><button class=x onclick="panel('mk')"><span class=i>⚑</span><small>Marcar</small></button><button class=x onclick=jump()><span class=i>⏭</span><small>Ir à marca</small></button><button class=x onclick=trashP()><span class=i>♻</span><small>Lixeira</small></button><span id=fc></span></div><div id=tf><button id=f_sel class=x onclick=fSelTog()><span class=i>☑</span><small>Selecionar quadros</small></button><button class=x onclick=addFN(1)><span class=i>＋›</span><small>Qua. Vazio Frente</small></button><button class=x onclick=addFN(0)><span class=i>‹＋</span><small>Qua. Vazio Trás</small></button><button id=f_cp class=x></button><button class=x onclick=fForget()><span class=i>🚫</span><small>Esquecer quadros</small></button><button class=x onclick=fgo(0)><span class=i>⏮</span><small>Primeiro</small></button><button class=x onclick=fgo(1)><span class=i>⏭</span><small>Último</small></button></div></div></div><div id=sw><div id=strip></div><div id=sm class=hid></div></div><div id=wh class=hid><span id=wn style="flex:1"></span><button id=wx style="height:30px;min-width:30px">✕</button></div><div id=wv class=hid></div></div></div><input type=file id=fi hidden>
